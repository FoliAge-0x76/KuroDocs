site_name: KuroDocs
repo_url: https://github.com/FoliAge-0x76/KuroDocs
plugins:
  - search
  - git-committers:
      repository: FoliAge-0x76/KuroDocs
      branch: master
      docs_path: docs/
nav:
  - 首页: index.md
  - 个人作品集: 
    - Steam 创意工坊项目: misc/workshop.md
    - 画集: misc/illustrations.md
  - 算法学习笔记: 
    - 数论:
      - 因数分解技巧: algo/factors.md
      - Möbius 反演: algo/mobius.md
      - Euler 函数: algo/euler_phi.md
    - 2-SAT: algo/2-sat.md
    - SAM : algo/sam.md
theme:
  name: moonstone
  locale: zh
  custom_dir: ./custom_theme/
extra:
  header_links:
    - name: 奥五报
      url: http://www.journalawb.xyz/
    - name: TEST
      url: '#'
    - name: 链接
      url: '#'
extra_css:
  - css/fonts.css
  - css/toc.css
  - css/layout.css
  - css/navigation.css
markdown_extensions:
  - pymdownx.highlight:
      guess_lang: false
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
