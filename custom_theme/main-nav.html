<nav id="mainnav" class="navbar navbar-default navbar-expand-md navbar-light sticky-top" role="navigation">
  {% block site_name %}
  <a class="navbar-brand" href="{{ nav.homepage.url | url }}">
    {{ config.site_name }}
  </a>
  {% endblock %}
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainnav-navbar-collapse" aria-controls="mainnav-navbar-collapse" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div id="mainnav-navbar-collapse" class="collapse navbar-collapse">
    {% block site_nav %}
    <ul class="nav navbar-nav mr-auto">
      {% for link in config.extra.header_links %}
        <li class="main-item">
          <a class="nav-link" href="{{ link.url | url }}">{{ link.name }}</a>
        </li>
      {% endfor %}
    </ul>
    {% endblock %}

    <ul class="navbar-nav flex-row ml-md-auto d-none d-md-flex">
      {% block search_button %}
      {% if 'search' in config.plugins %}
        <li class="nav-item">
          <a class="nav-link" href="#" data-toggle="modal" data-target="#mkdocs_search_modal">
            <i class="fa fa-search"></i> Search
          </a>
        </li>
      {% endif %}
      {% endblock %}
    </ul>
  </div>
</nav>
