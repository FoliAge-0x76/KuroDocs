{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script src="{{ 'javascripts/mathjax.js' | url }}"></script>
{% endblock %}

{% block styles %}
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" rel="stylesheet">
  <link href="{{ 'css/font-awesome.min.css' | url }}" rel="stylesheet">
  <link href="{{ 'css/code-styles.css' | url }}" rel="stylesheet">
  <link href="{{ 'css/mega-menu.css' | url }}" rel="stylesheet">
  <link href="{{ 'css/code-tabs.css' | url }}" rel="stylesheet">
  <link href="{{ 'css/admonition.css' | url }}" rel="stylesheet">
  <link href="{{ 'css/base.css' | url }}" rel="stylesheet">
  {% for path in config['extra_css'] %}
    <link href="{{ path | url }}" rel="stylesheet">
  {% endfor %}
{% endblock %}

{% block scripts %}
  <script>
    var base_url = {{ base_url | tojson }},
        shortcuts = {{ config.theme.shortcuts | tojson }};
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" defer></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" defer></script>
  <script src="{{ 'js/base.js' | url }}" defer></script>
  <script src="{{ 'javascripts/toc.js' | url }}" defer></script>
  <script>
    window.addEventListener("load", function () {
      if (window.hljs) hljs.highlightAll();
    });
  </script>
{% endblock %}
